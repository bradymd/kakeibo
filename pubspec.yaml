name: kakeibo
description: "Kakeibo - Japanese mindful budgeting app"
publish_to: 'none'
version: 1.1.0+21

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ^2.9.4
  path_provider: ^2.1.5
  path: ^1.9.1
  go_router: ^14.8.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.19.0
  uuid: ^4.5.1
  package_info_plus: ^9.0.0
  in_app_purchase: ^3.3.0
  url_launcher: ^6.3.1
  archive: ^4.0.2
  file_picker: ^8.1.7
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.3
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app-icon-1024.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/pig.png
    - assets/images/wolf.png
    - assets/images/pig-overlay.png
    - assets/images/wolf-overlay.png
    - assets/images/tip-jar.png
    - assets/images/wolf-please.png
    - assets/fonts/OFL.txt

  # M PLUS Rounded 1c, bundled rather than fetched at runtime via
  # google_fonts -- see lib/theme/toy/toy_text_styles.dart. SIL Open Font
  # License (confirmed via the font files' own embedded metadata), so
  # bundling/redistribution is permitted. Only the weights actually used
  # by ToyTextStyles are included (500/700/800/900 + the 400 base weight
  # GoogleFonts.mPlusRounded1c itself always registers); there is no
  # native 600 weight -- ToyTextStyles.body's w600 callers already
  # rendered via the nearest available weight at runtime (500, by
  # google_fonts' own closest-weight-match logic), so this list
  # intentionally matches that rather than adding a weight that was
  # never actually present before.
  fonts:
    - family: MPLUSRounded1c
      fonts:
        - asset: assets/fonts/MPLUSRounded1c-Regular.ttf
          weight: 400
        - asset: assets/fonts/MPLUSRounded1c-Medium.ttf
          weight: 500
        - asset: assets/fonts/MPLUSRounded1c-Bold.ttf
          weight: 700
        - asset: assets/fonts/MPLUSRounded1c-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/MPLUSRounded1c-Black.ttf
          weight: 900
